# PostgreSQL. In development and test, docker-compose sets DATABASE_URL (host,
# user, password) and the database name comes from here. In production the full
# connection string comes from DATABASE_URL (set by Render).
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: shipping_development

test:
  <<: *default
  database: shipping_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
