services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: shipping-backend-dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: sh -c "bundle check || bundle install; rm -f tmp/pids/server.pid; bin/rails db:prepare && bin/rails s -b 0.0.0.0 -p 3000"
    environment:
      DATABASE_URL: postgres://shipping:shipping@db:5432
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: dev-only-change-me
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  bundle:
